name: Preview Build

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "AGENTS.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "README.md"
      - "assets/**"
      - "docs/**"
      - "packaging/winget/**"
      - "packaging/windows/**"
      - "pyproject.toml"
      - "requirements-*.lock"
      - "scripts/**"
      - "src/**"
      - "tests/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: preview-build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python 3.13.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.12"
          cache: "pip"
          cache-dependency-path: "requirements-windows-build.lock"

      - name: Install verified Inno Setup
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\install-inno-setup.ps1

      - name: Install locked Python dependencies
        shell: powershell
        run: python -m pip install --require-hashes -r requirements-windows-build.lock

      - name: Generate assets
        shell: powershell
        run: python scripts/generate_assets.py

      - name: Build bundle and installer
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1 -Clean

      - name: Upload preview installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trayffeine-preview-installer-${{ github.event.pull_request.number || github.run_number }}
          path: dist/installer/*.exe
          if-no-files-found: error
