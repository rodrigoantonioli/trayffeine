name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RELEASE_TAG: ${{ github.ref_name }}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate release tag
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File packaging\windows\validate-release-tag.ps1 `
            -Tag $env:RELEASE_TAG

      - name: Set up Python 3.13.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.12"
          cache: "pip"
          cache-dependency-path: "requirements-windows-build.lock"

      - name: Install verified Inno Setup
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File packaging\windows\install-inno-setup.ps1

      - name: Install locked Python dependencies
        shell: powershell
        run: python -m pip install --require-hashes -r requirements-windows-build.lock

      - name: Generate assets
        shell: powershell
        run: python scripts/generate_assets.py

      - name: Build bundle and installer
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1 `
            -Version $env:RELEASE_TAG `
            -Clean

      - name: Upload verified release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trayffeine-release-installer
          path: dist/installer/*.exe
          if-no-files-found: error

  publish-release:
    needs: build-windows-installer
    runs-on: windows-latest
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out trusted release tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          path: release-tooling
          persist-credentials: false
          sparse-checkout: |
            packaging/windows/validate-release-tag.ps1
            packaging/winget
          sparse-checkout-cone-mode: false

      - name: Validate release tag
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass `
            -File release-tooling\packaging\windows\validate-release-tag.ps1 `
            -Tag $env:RELEASE_TAG

      - name: Download verified release candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: trayffeine-release-installer
          path: dist/installer

      - name: Publish release assets
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $isPrerelease = $tag -match '-beta(?:[.-]?\d+)?$'
          $files = @(Get-ChildItem -Path dist\installer -Filter *.exe | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) {
            throw "No installer artifact found in dist\installer"
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) {
              throw "gh release upload failed"
            }
            exit 0
          }

          $createArgs = @("release", "create", $tag, "--repo", $env:GITHUB_REPOSITORY)
          if ($isPrerelease) {
            $createArgs += "--prerelease"
          }
          $createArgs += $files
          $createArgs += @("--title", $tag, "--generate-notes")

          gh @createArgs
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed"
          }

      - name: Submit WinGet update
        shell: powershell
        env:
          WINGET_GITHUB_PAT: ${{ secrets.WINGET_GITHUB_PAT }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -match '-beta(?:[.-]?\d+)?$') {
            Write-Host "Skipping WinGet submission for prerelease tag: $tag"
            exit 0
          }

          if ([string]::IsNullOrWhiteSpace($env:WINGET_GITHUB_PAT)) {
            Write-Host "Skipping WinGet submission because WINGET_GITHUB_PAT is not configured."
            exit 0
          }

          $version = $tag.Substring(1)
          $installerUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/Trayffeine-Setup-$version.exe"

          powershell -ExecutionPolicy Bypass `
            -File release-tooling\packaging\winget\update.ps1 `
            -PackageIdentifier "RodrigoAntonioli.Trayffeine" `
            -PackageVersion $version `
            -InstallerUrl $installerUrl `
            -GitHubToken $env:WINGET_GITHUB_PAT
